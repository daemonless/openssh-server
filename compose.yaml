name: openssh-server

x-daemonless:
  title: "OpenSSH Server"
  icon: ":material-console-network:"
  category: "Infrastructure"
  description: "SSH and SFTP into a container: one user, key or password login, optional sudo."
  license: "SSH-OpenSSH"
  repo_url: "https://github.com/daemonless/openssh-server"
  upstream_url: "https://github.com/openssh/openssh-portable"
  web_url: "https://www.openssh.com/"
  freshports_url: "https://www.freshports.org/security/openssh-portable/"
  user: "bsd"
  mlock: false
  appjail: true
  community: "Discord:https://discord.gg/Kb9tkhecZT"

  docs:
    env:
      PUID: "User ID of the login user"
      PGID: "Group ID of the login user"
      TZ: "Timezone for the container"
      USER_NAME: "Login user name (default: bsd)"
      PUBLIC_KEY: "A public key added to authorized_keys"
      PUBLIC_KEY_FILE: "A file of public keys to add (works with secrets)"
      PUBLIC_KEY_DIR: "A directory of public key files to add"
      PUBLIC_KEY_URL: "A URL of public keys to add (e.g. https://github.com/<user>.keys)"
      PASSWORD_ACCESS: "true allows password login (default: false, keys only)"
      USER_PASSWORD: "The user's password (random if unset)"
      USER_PASSWORD_FILE: "A file holding the password; wins over USER_PASSWORD"
      SUDO_ACCESS: "true gives the user sudo (with password if one is set)"
      LISTEN_PORT: "Port sshd listens on (default: 2222)"
      UMASK: "umask for SFTP uploads (default: 022)"
    volumes:
      /config: "Home directory, authorized_keys, host keys and sshd_config"
    ports:
      2222: "SSH"

services:
  openssh-server:
    image: ghcr.io/daemonless/openssh-server:latest
    container_name: openssh-server
    # "always", not "unless-stopped": FreeBSD's podman rc.d only auto-starts
    # containers with restart-policy=always at boot (needs podman_enable=YES).
    restart: always

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - USER_NAME=bsd
      - PUBLIC_KEY=ssh-ed25519 AAAA... you@example
      - PASSWORD_ACCESS=false
      - SUDO_ACCESS=false

    volumes:
      - /path/to/containers/openssh-server:/config

    ports:
      - 2222:2222
